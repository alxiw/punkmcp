# Nginx location snippet for proxying PunkMCP Streamable HTTP traffic
# from https://punkapi.dev/mcp to the local PunkMCP container.
#
# Include this inside your HTTPS `server { ... }` block.
# If Nginx runs on the same Docker network as punkmcp, replace
# `http://127.0.0.1:8080` with `http://punkmcp:8080`.

location = /mcp {
    proxy_pass http://127.0.0.1:8080/mcp;
    proxy_http_version 1.1;

    # Required for keep-alive and Streamable HTTP / SSE streaming
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;

    # Keep long-lived MCP streaming sessions open
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

